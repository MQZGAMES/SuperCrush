<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6a1fd1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SuperCrush">
  <meta name="application-name" content="SuperCrush">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="SuperCrush - combine doces, crie especiais e vença as fases. Jogo de combinar 3, mobile first.">
  <title>SuperCrush</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="bokeh"><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <section id="screen-title" class="screen active">
      <canvas id="title-rain"></canvas>
      <button class="icon-btn btn-sound corner" aria-label="Som"></button>
      <div class="title-center">
        <h1 class="logo">
          <span class="l1" data-t="Super">Super</span>
          <span class="l2" data-t="Crush">Crush</span>
        </h1>
        <p class="tagline">Combine. Exploda. Adoce o dia!</p>
        <button class="btn primary huge" id="btn-play">Jogar</button>
        <button class="btn secondary" id="btn-infinite">∞ Modo Infinito</button>
        <p class="inf-best" id="inf-best"></p>
        <button class="install-btn" id="btn-install" hidden>📲 Instalar app</button>
        <p class="install-tip" id="install-tip" hidden>No iPhone: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</p>
      </div>
    </section>

    <section id="screen-map" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="map-back" aria-label="Voltar">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="mini-logo">Super<b>Crush</b></div>
        <div class="map-stars" id="map-stars"></div>
        <button class="icon-btn btn-sound" aria-label="Som"></button>
      </header>
      <div id="map-scroll"><div id="map-inner"></div></div>
    </section>

    <section id="screen-game" class="screen">
      <header class="hud">
        <div class="hud-top">
          <button class="icon-btn" id="btn-pause" aria-label="Pausa">
            <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
          </button>
          <div class="hud-level">Nível <b id="hud-level">1</b></div>
          <button class="icon-btn btn-sound" aria-label="Som"></button>
        </div>
        <div class="hud-panel">
          <div class="hud-moves"><small>Jogadas</small><b id="hud-moves">20</b></div>
          <div class="hud-score">
            <b id="hud-score">0</b>
            <div id="starbar"><div class="fill"></div><i class="mk"></i><i class="mk"></i><i class="mk"></i></div>
          </div>
          <div class="hud-goals" id="hud-goals"></div>
        </div>
      </header>
      <div id="board-wrap">
        <div class="board-frame"><canvas id="board"></canvas></div>
        <div id="combo-text"></div>
      </div>
      <div id="game-footer"><button class="btn sacanear" id="btn-help">😈 Sacanear</button></div>
    </section>

    <div id="modal"><div class="card"></div></div>
    <div id="confetti"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
